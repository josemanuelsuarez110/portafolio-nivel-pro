version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: level-pro-db
    restart: always
    environment:
      POSTGRES_USER: user_pro
      POSTGRES_PASSWORD: password_pro
      POSTGRES_DB: level_pro_db
    ports:
      - "5432:5432"
    volumes:
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user_pro -d level_pro_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://user_pro:password_pro@db:5432/level_pro_db
      FRONTEND_URL: "http://localhost:3000"

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:8000"

volumes:
  postgres_data:
